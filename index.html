<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gold Miner</title>

    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>

    <h1>Gold Miner</h1>

    <p id="goldMined">0 Gold Mined</p>
    <button id="mineButton">Mine Gold</button>

    <p id="clickProduction">1 Gold per Click</p>
    <p id="production" hidden>0 Gold per Second</p>

    <button id="pickaxeButton">Upgrade Pickaxe</button>

    <div id="tabNavigation">
        <button id="generatorsTabButton" class="active">Generators</button>
        <button id="upgradesTabButton" hidden>Upgrades</button>
    </div>

    <div id="generatorsTab">
        <div id="generatorSection" hidden>
            <div id="generatorContainer"></div>
        </div>
    </div>

    <div id="upgradesTab" hidden>
        <h2>Upgrades</h2>
        <div id="upgradeContainer"></div>
    </div>

    <div id="settingsSection">
        <h2>Settings</h2>
        <button id="saveButton">Save Game</button>
        <button id="resetButton">Reset Game</button>
        <p id="message"></p>
    </div>

</body>
</html>
